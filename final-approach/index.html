<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#153f65"><title>Final Approach</title><style>*{box-sizing:border-box}body{margin:0;background:#102b49;color:white;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:15px 18px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:0 2px 4px #1238}#overlay{position:fixed;inset:0;background:#092844bb;display:flex;align-items:center;justify-content:center;padding:24px}#panel{max-width:370px;text-align:center;background:#123e68;border:3px solid #7ce5e0;border-radius:24px;padding:28px;box-shadow:0 12px 50px #0018}h1{font-size:35px;margin:0 0 8px;color:#ffe18a}p{line-height:1.5}button{border:0;border-radius:30px;background:#ffcc64;color:#18344f;padding:14px 32px;font-size:18px;font-weight:900}small{display:block;margin-top:14px;opacity:.8}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="score">LANDED 0</span><span id="level">LEVEL 1</span></div><div id="overlay"><div id="panel"><h1 id="headline">FINAL APPROACH</h1><p id="message">Draw a path from each aircraft to its matching landing zone. Jets use the runway; helicopters use the helipad. Keep them apart!</p><button id="start">START GAME</button><small>Made for touchscreens · Prototype 0.1</small></div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay');let W,H,dpr,planes=[],particles=[],score=0,elapsed=0,spawnTimer=0,active=null,drawing=false,playing=false,last=0,uid=0;
const types={jet:{color:'#ffdf70',speed:80,turn:2.4,size:17,target:'runway'},prop:{color:'#8ff0fd',speed:56,turn:3.3,size:14,target:'runway'},heli:{color:'#fa8baf',speed:43,turn:4.5,size:13,target:'helipad'}};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function runway(){return{x:W*.74,y:H*.55,w:Math.min(38,W*.095),h:Math.min(170,H*.24)}}function pad(){return{x:W*.22,y:H*.77,r:Math.min(29,W*.085)}}
function spawn(){const keys=['jet','prop','heli'],type=keys[Math.floor(Math.random()*keys.length)],edge=Math.floor(Math.random()*4),margin=25,x=edge===0?-margin:edge===1?W+margin:Math.random()*W,y=edge===2?-margin:edge===3?H+margin:Math.random()*H;const target=type==='heli'?pad():runway();let angle=Math.atan2(target.y-y,target.x-x);planes.push({id:uid++,x,y,angle,type,path:[],age:0});}
function reset(){planes=[];particles=[];score=0;elapsed=0;spawnTimer=0;active=null;playing=true;overlay.style.display='none';document.getElementById('score').textContent='LANDED 0';document.getElementById('level').textContent='LEVEL 1';spawn();spawn();last=performance.now()}
document.getElementById('start').onclick=reset;
function pos(e){return{x:e.clientX,y:e.clientY}}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}c.addEventListener('pointerdown',e=>{if(!playing)return;const p=pos(e);let best=null,bd=38;for(const a of planes){const d=dist(p,a);if(d<bd){best=a;bd=d}}if(best){active=best;active.path=[];drawing=true;c.setPointerCapture(e.pointerId)}});c.addEventListener('pointermove',e=>{if(!drawing||!active)return;const p=pos(e),path=active.path;if(!path.length||dist(p,path[path.length-1])>8)path.push(p)});function finish(){drawing=false;active=null}c.addEventListener('pointerup',finish);c.addEventListener('pointercancel',finish);
function end(){playing=false;document.getElementById('headline').textContent='GAME OVER';document.getElementById('message').textContent=`You landed ${score} aircraft. Draw wider paths and keep traffic separated!`;document.getElementById('start').textContent='PLAY AGAIN';overlay.style.display='flex'}
function update(dt){elapsed+=dt;spawnTimer-=dt;const level=1+Math.floor(score/8);document.getElementById('level').textContent='LEVEL '+level;if(spawnTimer<=0){spawn();spawnTimer=Math.max(1.15,4.1-level*.34)*(0.8+Math.random()*.4)}for(const a of planes){const t=types[a.type];a.age+=dt;let target=a.path[0];if(target&&dist(a,target)<13){a.path.shift();target=a.path[0]}if(target){let desired=Math.atan2(target.y-a.y,target.x-a.x),delta=Math.atan2(Math.sin(desired-a.angle),Math.cos(desired-a.angle));a.angle+=Math.max(-t.turn*dt,Math.min(t.turn*dt,delta))}a.x+=Math.cos(a.angle)*t.speed*dt;a.y+=Math.sin(a.angle)*t.speed*dt}for(let i=planes.length-1;i>=0;i--){const a=planes[i],t=types[a.type],r=runway(),h=pad();let landed=t.target==='runway'?Math.abs(a.x-r.x)<r.w*.65&&Math.abs(a.y-r.y)<r.h*.48:dist(a,h)<h.r*.85;if(landed){planes.splice(i,1);score++;document.getElementById('score').textContent='LANDED '+score;for(let j=0;j<12;j++)particles.push({x:a.x,y:a.y,vx:(Math.random()-.5)*130,vy:(Math.random()-.5)*130,life:.7,color:t.color});continue}if(a.x<-85||a.x>W+85||a.y<-85||a.y>H+85){planes.splice(i,1)}}for(let i=0;i<planes.length;i++)for(let j=i+1;j<planes.length;j++)if(dist(planes[i],planes[j])<23){end();return}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0)}
function plane(a){const t=types[a.type];ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.angle+Math.PI/2);ctx.fillStyle=t.color;ctx.strokeStyle='#173b56';ctx.lineWidth=2;ctx.beginPath();if(a.type==='heli'){ctx.roundRect(-5,-13,10,25,5);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-17,-4);ctx.lineTo(17,-4);ctx.moveTo(-9,8);ctx.lineTo(9,8);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke()}else{ctx.moveTo(0,-t.size);ctx.lineTo(5,-3);ctx.lineTo(t.size,5);ctx.lineTo(t.size,9);ctx.lineTo(4,7);ctx.lineTo(3,t.size-1);ctx.lineTo(8,t.size+3);ctx.lineTo(8,t.size+6);ctx.lineTo(0,t.size+3);ctx.lineTo(-8,t.size+6);ctx.lineTo(-8,t.size+3);ctx.lineTo(-3,t.size-1);ctx.lineTo(-4,7);ctx.lineTo(-t.size,9);ctx.lineTo(-t.size,5);ctx.lineTo(-5,-3);ctx.closePath();ctx.fill();ctx.stroke()}ctx.restore()}
function draw(){let bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#246e87');bg.addColorStop(1,'#164f78');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff12';ctx.lineWidth=1;for(let x=0;x<W;x+=35){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=35){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}const r=runway(),h=pad();ctx.save();ctx.translate(r.x,r.y);ctx.fillStyle='#23364d';ctx.strokeStyle='#e3eff1';ctx.lineWidth=3;ctx.fillRect(-r.w/2,-r.h/2,r.w,r.h);ctx.strokeRect(-r.w/2,-r.h/2,r.w,r.h);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([13,11]);ctx.beginPath();ctx.moveTo(0,-r.h/2+12);ctx.lineTo(0,r.h/2-12);ctx.stroke();ctx.setLineDash([]);ctx.restore();ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.fillStyle='#3a6570';ctx.fill();ctx.strokeStyle='#ff9fc0';ctx.lineWidth=4;ctx.stroke();ctx.font=`bold ${h.r}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText('H',h.x,h.y+1);ctx.font='bold 12px system-ui';ctx.fillStyle='#dceff2';ctx.fillText('RUNWAY',r.x,r.y-r.h/2-15);ctx.fillText('HELIPAD',h.x,h.y-h.r-13);for(const a of planes){if(a.path.length){ctx.beginPath();ctx.moveTo(a.x,a.y);for(const p of a.path)ctx.lineTo(p.x,p.y);ctx.strokeStyle=types[a.type].color;ctx.lineWidth=3;ctx.setLineDash([7,7]);ctx.stroke();ctx.setLineDash([])}plane(a)}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.7);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function frame(now){let dt=Math.min((now-last)/1000||0,.05);last=now;if(playing)update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
